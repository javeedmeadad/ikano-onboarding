<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${page.step().title()} + ' — Onboarding'">Onboarding step</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<header class="site">
    <div class="brand">IKANO<span>·</span>onboarding sample</div>
    <div th:text="${page.country()} + ' / ' + ${page.customerType()}"></div>
</header>
<main>

    <div class="progress">
        <span th:each="s : ${page.allSteps()}"
              class="step"
              th:classappend="${page.completedStepKeys().contains(s.key()) ? 'done' : (s.key() == page.step().key() ? 'current' : '')}"
              th:text="${s.title()}"></span>
    </div>

    <div class="card">
        <h1 th:text="${page.step().title()}">Step title</h1>
        <p class="lead" th:text="${page.step().description()}">Step description</p>

        <div class="banner error" th:if="${page.integrationFailureMessage() != null}">
            <strong th:text="${page.retryable() ? 'Temporary issue — please retry: ' : 'Check failed: '}"></strong>
            <span th:text="${page.integrationFailureMessage()}"></span>
        </div>

        <div th:if="${page.step().reviewStep()}">
            <h2>Your answers so far</h2>
            <div th:each="entry : ${page.reviewData()}" style="margin-bottom:1rem;">
                <h3 style="margin-bottom:0.3rem;font-size:0.95rem;" th:text="${entry.key}"></h3>
                <table>
                    <tr th:each="kv : ${entry.value}">
                        <td th:text="${kv.key}"></td>
                        <td th:text="${kv.value}"></td>
                    </tr>
                </table>
            </div>
        </div>

        <form method="post" th:action="@{'/onboarding/' + ${page.applicationId()} + '/step'}">
            <input type="hidden" name="stepKey" th:value="${page.step().key()}"/>

            <div class="field" th:each="field : ${page.step().fields()}">

                <div th:if="${field.type().name() == 'CHECKBOX'}" class="checkbox-row">
                    <input type="checkbox" th:id="${field.name()}" th:name="${field.name()}" value="true"
                           th:checked="${page.values().get(field.name()) == 'true'}"/>
                    <label th:for="${field.name()}" th:text="${field.label()}"></label>
                </div>

                <div th:unless="${field.type().name() == 'CHECKBOX'}">
                    <label th:for="${field.name()}" th:text="${field.label()}"></label>

                    <input th:if="${field.type().name() == 'TEXT'}" type="text"
                           th:id="${field.name()}" th:name="${field.name()}"
                           th:value="${page.values().get(field.name())}"/>

                    <input th:if="${field.type().name() == 'NUMBER'}" type="number" step="any"
                           th:id="${field.name()}" th:name="${field.name()}"
                           th:value="${page.values().get(field.name())}"/>

                    <select th:if="${field.type().name() == 'SELECT'}"
                            th:id="${field.name()}" th:name="${field.name()}">
                        <option value="">Select…</option>
                        <option th:each="opt : ${field.options()}" th:value="${opt}" th:text="${opt}"
                                th:selected="${opt == page.values().get(field.name())}"></option>
                    </select>

                    <textarea th:if="${field.type().name() == 'TEXTAREA'}"
                              th:id="${field.name()}" th:name="${field.name()}"
                              th:text="${page.values().get(field.name())}"></textarea>
                </div>

                <div class="help" th:if="${field.helpText() != null}" th:text="${field.helpText()}"></div>
                <span class="error" th:if="${page.fieldErrors().get(field.name()) != null}"
                      th:text="${page.fieldErrors().get(field.name())}"></span>
            </div>

            <div class="actions">
                <button type="submit"
                        th:text="${page.step().reviewStep() ? 'Submit application' : (page.step().integrationType() != null ? 'Continue and run check' : 'Continue')}">
                    Continue
                </button>
                <a class="btn secondary" th:href="@{/}">Start over</a>
            </div>
        </form>
    </div>

    <div class="resume-box">
        Dropping off? Save this link to resume later (valid 24 hours):<br/>
        <a th:href="${page.resumeUrl()}" th:text="${page.resumeUrl()}"></a>
    </div>
</main>
</body>
</html>
