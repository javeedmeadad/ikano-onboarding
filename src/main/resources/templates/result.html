<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Application decision</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<header class="site">
    <div class="brand">IKANO<span>·</span>onboarding sample</div>
    <div th:text="${summary.application().getCountry()} + ' / ' + ${summary.application().getCustomerType()}"></div>
</header>
<main>
    <div class="card">
        <p class="lead">Application ID: <span th:text="${summary.application().getId()}"></span></p>
        <div class="decision" th:classappend="${summary.application().getFinalDecision()}"
             th:text="${summary.application().getFinalDecision()}"></div>
        <p th:text="${summary.application().getDecisionReason()}"></p>
        <a class="btn secondary" th:href="@{/}">Start a new application</a>
    </div>

    <div class="card">
        <h2>Checks performed</h2>
        <table>
            <tr>
                <th>Check</th>
                <th>Outcome</th>
                <th>Detail</th>
                <th>Request ID</th>
                <th>Checked at</th>
            </tr>
            <tr th:each="r : ${summary.integrationResults()}">
                <td th:text="${r.getIntegrationType()}"></td>
                <td><span class="tag" th:classappend="${r.getOutcome()}" th:text="${r.getOutcome()}"></span></td>
                <td th:text="${r.getDetailCode()}"></td>
                <td th:text="${r.getRequestId()}"></td>
                <td th:text="${r.getCheckedAt()}"></td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>Audit trail</h2>
        <table>
            <tr>
                <th>Event</th>
                <th>Description</th>
                <th>Request ID</th>
                <th>When</th>
            </tr>
            <tr th:each="a : ${summary.auditTrail()}">
                <td th:text="${a.getEventType()}"></td>
                <td th:text="${a.getDescription()}"></td>
                <td th:text="${a.getRequestId()}"></td>
                <td th:text="${a.getOccurredAt()}"></td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>Submitted answers</h2>
        <div th:each="entry : ${summary.stepData()}" style="margin-bottom:1rem;">
            <h3 style="margin-bottom:0.3rem;font-size:0.95rem;" th:text="${entry.key}"></h3>
            <table>
                <tr th:each="kv : ${entry.value}">
                    <td th:text="${kv.key}"></td>
                    <td th:text="${kv.value}"></td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
