spring.application.name=ikano-onboarding

# H2 file-based DB so data survives restarts (swap to Postgres by changing these 4 lines + driver dep)
spring.datasource.url=jdbc:h2:file:./data/onboarding;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

logging.level.com.ikano.onboarding=INFO
